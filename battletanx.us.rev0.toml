# Config file for BattleTanx NTSC 1.0 Recompilation.

[input]
entrypoint = 0x80071000
# Paths are relative to the location of this config file.
output_func_path = "RecompiledFuncs"
rom_file_path = "BattleTanx (USA).z64"
symbols_file_path = "BattleTanxSyms/battletanx.us.rev0.syms.toml"

# What follows, up to the "Fixes for running on the stock runtime" block, is generated from the ROM
# and the symbol table by tools/battletanx/recomp_config/gen_full_cfg.py. It lets stock N64Recomp
# handle this game; regenerate it rather than editing it by hand.
#
# stubs: two cache-invalidate loops. The host caches are coherent, so there is nothing to do.
# ignored + renamed: osSp*/osSi* come from librecomp, and callers use its _recomp entry points.
# ignored (last five): entries in the symbol table that sit inside other functions and have no callers.
[patches]
stubs = ["func_801226A0", "func_80122720"]
ignored = ["osSpGetStatus", "osSpSetStatus", "osSiGetStatus", "osSiReadIo", "osSiWriteIo", "osSiRawStartDma", "func_80080E50", "func_80081654", "func_8008A718", "func_800D6238", "func_800F12C4"]
renamed = ["osSpGetStatus", "osSpSetStatus", "osSiGetStatus", "osSiReadIo", "osSiWriteIo", "osSiRawStartDma"]

# Instruction patches. A value of 0 is a nop. They cover cop0 writes and eret (nothing is emulated),
# data words inside a function's symbol range that would write to $zero, the branches that leave
# their function, and every div/divu/ddiv/ddivu (the guarded version is a hook, below).

