# Hooks. MIPS leaves LO/HI undefined on a divide by zero, while x86 raises SIGFPE, so each division
# gets the divisor check the hardware does not need. The hooks that end in a return replace a
# branch to an address outside its function; they repeat the delay slot so the effect is the same.

[[patches.hook]]
func = "func_8008228C"
before_vram = 0x80082490
text = """
    if (U32(ctx->r3) != 0) { lo = S32(U32(ctx->r4) / U32(ctx->r3)); hi = S32(U32(ctx->r4) % U32(ctx->r3)); } else { lo = 0; hi = 0; }
"""

