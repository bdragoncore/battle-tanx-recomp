# Fixes for running on the stock runtime. A hook's text is inserted before the instruction at
# before_vram, after any label for that address, so a hook on a loop head runs on every pass.
# yield_self_1ms_recomp is declared in include/btx_recomp_hooks.h. The "btx-patch:" comments mark
# the generated result; the build checks for them (cmake/check_stock_funcs.cmake).
#
# Stock only delivers VI/SP messages to a game queue when a game thread blocks or yields, and the
# id-3 thread (the VI manager) is the one that clears the gates below. Loops that never yield
# keep it from running.

# func_8007E248, DEFRAG's task-slot dispatch, waits on the +0xC0 gate. The original loads it into
# $t0 once and spins on the register, which only ends if the gate is already clear on entry.
# Re-read it on each pass, and yield when the loop is about to go round again.
[[patches.hook]]
func = "func_8007E248"
before_vram = 0x8007E258
text = """
    // btx-patch: re-read the +0xC0 gate on each pass and yield if it is still set.
    ctx->r8 = MEM_H(ctx->r5, 0XC0);
    if (ctx->r8 != ctx->r7) { yield_self_1ms_recomp(rdram, ctx); }
"""

# The same function, when no task slot is free: yield so the VI manager can release one.
[[patches.hook]]
func = "func_8007E248"
before_vram = 0x8007E2B8
text = """
    // btx-patch: yield when no task slot is free.
    if (ctx->r2 == ctx->r7) { yield_self_1ms_recomp(rdram, ctx); }
"""

# func_8007A5A4, the AUDIO tick builder, waits for the sound slot at [0x80125764] to clear. Same
# stale-register spin as above, and id-3 clears the slot only if this thread yields.
[[patches.hook]]
func = "func_8007A5A4"
before_vram = 0x8007A70C
text = """
    // btx-patch: re-read the sound slot ([0x80125764]) on each pass and yield.
    ctx->r2 = MEM_W(S32(0X8012 << 16), 0X5764);
    yield_self_1ms_recomp(rdram, ctx);
"""

# func_8007D850 (gfxBeginDisplayList) waits at L_8007D874 for D4 to clear, through the pointer at
# [0x801257C8]. id-3 clears it once it runs, and it only runs if DEFRAG yields. This is the back
# edge of that loop.
[[patches.hook]]
func = "func_8007D850"
before_vram = 0x8007D890
text = """
    // btx-patch: yield in the D4 wait.
    yield_self_1ms_recomp(rdram, ctx);
"""

# Gameplay change, not a fix. func_800987D8 (the player fire routine) is the only place ammo is
# decremented. It honours the LTSFBLLTS cheat (0x80135760) and the Unlimited Ammo option
# (0x80134E69) only for weapon slots 0-3; slot 4 and up branch straight to the decrement. Take the
# same "skip decrement" exit (L_800998FC, $v0 = slot << 1) for those slots.
[[patches.hook]]
func = "func_800987D8"
before_vram = 0x800998A8
text = """
    // btx-patch: unlimited ammo. Apply the cheat and the option to slots 4 and up as well.
    if (ctx->r2 == ctx->r0 && (MEM_BU(S32(0X8013 << 16), 0X5760) != 0 ||
                               MEM_BU(S32(0X8013 << 16), 0X4E69) != 0)) {
        ctx->r2 = S32(ctx->r3 << 1);
        goto L_800998FC;
    }
"""
